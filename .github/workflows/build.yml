name: Build & push images (optionnel)

# OPTIONNEL — par défaut on build directement sur l'instance Scaleway.
# Ce workflow ne sert que si tu veux pré-builder vers GHCR (éviter de recompiler
# sur une NOUVELLE instance). Déclenchement MANUEL uniquement (onglet Actions),
# ou sur tag de version.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [geneman, unitex]
    steps:
      - uses: actions/checkout@v4

      # Les images CUDA sont volumineuses : on libère de l'espace sur le runner.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.model }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.model }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mytwin-${{ matrix.model }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
