name: Deploy backend to Scaleway

# Construit l'image Docker du backend et la pousse sur le Container Registry
# Scaleway — depuis les runners GitHub (connexion rapide), pour ne jamais avoir à
# uploader les ~500 Mo d'image depuis une machine locale.
#
# Secret requis (Settings -> Secrets and variables -> Actions) :
#   SCW_SECRET_KEY  = clé secrète d'une clé API Scaleway dédiée (droits limités au
#                     Container Registry du projet). Sert de mot de passe au login
#                     Docker (utilisateur littéral "nologin").
#
# Le registre doit exister au préalable (namespace "mytwin-avatar", région fr-par).

on:
  push:
    branches: [main]
    paths:
      - 'scalingo/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:      # permet un lancement manuel depuis l'onglet Actions

env:
  REGISTRY: rg.fr-par.scw.cloud
  IMAGE: rg.fr-par.scw.cloud/mytwin-avatar/mytwin-avatar-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login au Container Registry Scaleway
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build & push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: scalingo/backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Optionnel : redéployer le Serverless Container sur la nouvelle image ---
      # Pousser un nouveau :latest ne redéploie PAS un conteneur déjà en place.
      # Une fois le conteneur créé, décommente ce bloc et ajoute les secrets
      # SCW_ACCESS_KEY / SCW_DEFAULT_PROJECT_ID + la variable CONTAINER_ID.
      #
      # - name: Redéploiement du conteneur
      #   uses: scaleway/action-scw@v0
      #   with:
      #     access-key: ${{ secrets.SCW_ACCESS_KEY }}
      #     secret-key: ${{ secrets.SCW_SECRET_KEY }}
      #     default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      #     default-region: fr-par
      #     args: container container deploy ${{ vars.CONTAINER_ID }}
