<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>MyTwin Avatar — Accès</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{min-height:100dvh;display:grid;place-items:center;padding:24px;
      font-family:'Inter',system-ui,sans-serif;color:#0f172a;background:#e8eef8;}
    .box{background:#fff;border:1px solid #d1daea;border-radius:18px;
      box-shadow:0 4px 16px rgba(15,23,42,.09);padding:30px 26px;width:100%;max-width:360px;text-align:center;}
    .logo{width:46px;height:46px;border-radius:13px;margin:0 auto 16px;
      background:linear-gradient(135deg,#2dd4bf,#0d9488);display:grid;place-items:center;color:#fff;font-weight:800;font-size:21px;}
    h1{font-size:18px;margin-bottom:6px;}
    p{color:#64748b;font-size:13px;margin-bottom:18px;}
    input{width:100%;padding:14px;border-radius:12px;border:1px solid #d1daea;background:#f6f9fd;color:#0f172a;
      font-size:16px;text-align:center;letter-spacing:2px;font-family:inherit;}
    input:focus{outline:none;border-color:#2dd4bf;box-shadow:0 0 0 3px rgba(45,212,191,.15);}
    button{width:100%;margin-top:12px;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;
      font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(135deg,#2dd4bf,#0d9488);}
    .err{color:#991b1b;font-size:13px;margin-top:12px;font-weight:600;}
  </style>
</head>
<body>
  <form class="box" method="post">
    <div class="logo">M</div>
    <h1>Accès privé</h1>
    <p>Entrez le code d'accès pour continuer.</p>
    <input type="password" name="code" placeholder="Code d'accès" autofocus autocomplete="off" />
    <button type="submit">Entrer</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
