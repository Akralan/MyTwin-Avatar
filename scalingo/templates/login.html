<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f1a" />
  <title>MyTwin Avatar — Accès</title>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
      background:radial-gradient(120% 80% at 50% 0%, #1a1d33 0%, #0e0f1a 60%);color:#eef0fb;padding:24px;}
    .box{background:#1b1e34;border:1px solid #2a2e4a;border-radius:18px;padding:28px;width:100%;max-width:360px;text-align:center;}
    .logo{width:44px;height:44px;border-radius:12px;margin:0 auto 14px;
      background:linear-gradient(135deg,#6d5efc,#00d4ff);display:grid;place-items:center;font-weight:800;color:#fff;font-size:20px;}
    h1{font-size:18px;margin:0 0 6px;} p{color:#9aa0c4;font-size:13px;margin:0 0 18px;}
    input{width:100%;padding:14px;border-radius:12px;border:1px solid #2a2e4a;background:#161829;color:#eef0fb;font-size:16px;text-align:center;letter-spacing:2px;}
    button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#6d5efc,#00d4ff);}
    .err{color:#ff9aa2;font-size:13px;margin-top:12px;}
  </style>
</head>
<body>
  <form class="box" method="post">
    <div class="logo">M</div>
    <h1>Accès privé</h1>
    <p>Entrez le code d'accès pour continuer.</p>
    <input type="password" name="code" placeholder="Code d'accès" autofocus autocomplete="off" />
    <button type="submit">Entrer</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
