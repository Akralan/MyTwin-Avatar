<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>MyTwin Avatar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#e8eef8; --surface:#fff; --navy:#0f172a; --navy-mid:#1e3a5f;
      --teal:#2dd4bf; --teal-dark:#0d9488; --teal-pill:#b2f0e8;
      --gray:#64748b; --gray-light:#94a3b8; --border:#d1daea;
      --border-teal:rgba(45,212,191,.35);
      --shadow-sm:0 1px 3px rgba(15,23,42,.07),0 1px 2px rgba(15,23,42,.04);
      --shadow-md:0 4px 16px rgba(15,23,42,.09),0 2px 6px rgba(15,23,42,.05);
      --radius:16px; --radius-sm:10px; --radius-pill:100px;
    }
    html,body{min-height:100%;}
    body{
      background:var(--bg); color:var(--navy);
      font-family:'Inter',system-ui,sans-serif;
      min-height:100dvh; display:flex; flex-direction:column;
      -webkit-tap-highlight-color:transparent;
    }

    /* HEADER */
    header{
      position:sticky; top:0; z-index:10;
      display:flex; align-items:center; gap:10px;
      padding:0 18px; height:56px;
      background:var(--surface); border-bottom:1px solid var(--border); box-shadow:var(--shadow-sm);
    }
    .logo{
      width:30px;height:30px;border-radius:9px;flex:none;
      background:linear-gradient(135deg,var(--teal),var(--teal-dark));
      display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
    }
    .brand .wordmark{font-size:15px;font-weight:800;letter-spacing:-.4px;line-height:1;}
    .brand .sub{font-size:10px;font-weight:700;color:var(--teal-dark);letter-spacing:.5px;}
    #status-pill{margin-left:auto;font-size:11px;font-weight:700;padding:4px 11px;border-radius:var(--radius-pill);}
    #status-pill.ok{background:#d1fae5;color:#065f46;}
    #status-pill.off{background:#fee2e2;color:#991b1b;}

    /* LAYOUT */
    main{flex:1;width:100%;max-width:540px;margin:0 auto;padding:16px;display:flex;flex-direction:column;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
    .label{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--gray-light);margin:2px 4px 9px;}
    .screen{display:none;flex-direction:column;gap:16px;animation:fade .25s ease;}
    .screen.active{display:flex;}
    @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

    /* BANNER */
    #banner{display:none;padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;}
    #banner.show{display:block;}
    #banner.err{background:#fee2e2;color:#991b1b;}

    /* DROP / PREVIEW */
    #drop{
      border:2px dashed var(--border);border-radius:var(--radius);background:var(--bg);
      padding:40px 22px;text-align:center;cursor:pointer;transition:.2s;
      display:flex;flex-direction:column;align-items:center;gap:11px;
    }
    #drop:active{transform:scale(.99);}
    #drop.drag{border-color:var(--teal);background:rgba(45,212,191,.05);}
    .drop-icon{width:56px;height:56px;border-radius:15px;border:1.5px solid var(--border-teal);
      background:linear-gradient(135deg,rgba(45,212,191,.12),rgba(45,212,191,.03));display:grid;place-items:center;}
    .drop-icon svg{width:27px;height:27px;color:var(--teal-dark);}
    #drop h2{font-size:16px;font-weight:700;}
    #drop p{font-size:13px;color:var(--gray);}
    .pill{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:9px 20px;
      background:var(--teal-pill);color:var(--navy);font-size:13px;font-weight:700;border:none;border-radius:var(--radius-pill);cursor:pointer;}
    input[type=file]{display:none;}
    #preview-card{padding:10px;display:none;}
    #preview-card.show{display:block;}
    #preview{width:100%;display:block;border-radius:12px;max-height:300px;object-fit:cover;background:var(--bg);}
    .change{margin-top:10px;width:100%;padding:11px;font-size:13px;font-weight:600;color:var(--gray);
      background:transparent;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;}

    /* OPTIONS */
    .opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 16px;}
    .opt+.opt{border-top:1px solid var(--border);}
    .opt .lbl{font-size:15px;font-weight:600;}
    .opt .desc{font-size:12px;color:var(--gray);margin-top:2px;}
    .switch{position:relative;width:46px;height:26px;flex:none;}
    .switch input{opacity:0;width:0;height:0;}
    .slider{position:absolute;inset:0;background:var(--border);border-radius:var(--radius-pill);transition:.2s;cursor:pointer;}
    .slider::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:var(--shadow-sm);transition:.2s;}
    .switch input:checked + .slider{background:var(--teal);}
    .switch input:checked + .slider::before{transform:translateX(20px);}

    /* BUTTONS */
    .btn{width:100%;border:none;border-radius:var(--radius);padding:16px;font-size:16px;font-weight:700;
      font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--teal),var(--teal-dark));
      box-shadow:0 4px 14px rgba(13,148,136,.28);transition:transform .1s,opacity .2s;}
    .btn:active{transform:translateY(1px);}
    .btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;}
    .btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--border);box-shadow:none;}
    .hint{font-size:12px;color:var(--gray);text-align:center;}

    /* PROGRESS */
    .prog-card{padding:30px 22px;text-align:center;}
    .spinner{width:42px;height:42px;margin:0 auto 18px;border:3px solid rgba(45,212,191,.25);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:16px 0 10px;}
    .bar>i{display:block;height:100%;width:5%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--teal-dark));transition:width .4s;}
    #ptext{font-size:13px;font-weight:600;color:var(--navy-mid);}
    #pthumb{width:84px;height:84px;border-radius:14px;object-fit:cover;margin:0 auto 6px;display:block;box-shadow:var(--shadow-sm);}

    /* RESULT / VIEWER */
    model-viewer{width:100%;height:60dvh;min-height:380px;background:
      radial-gradient(circle at 50% 40%, #f3f7fd 0%, var(--bg) 70%);
      border-radius:var(--radius);--poster-color:transparent;}
    .viewer-card{padding:8px;}
    .row{display:flex;gap:10px;}
    .row>*{flex:1;}

    footer{text-align:center;color:var(--gray-light);font-size:11px;padding:14px;}
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="wordmark">MyTwin</div><div class="sub">AVATAR</div></div>
    <span id="status-pill" class="off">…</span>
  </header>

  <main>
    <div id="banner"></div>

    <!-- ── ÉTAPE 1 : options + photo (génération auto à l'ajout) ── -->
    <section id="s-upload" class="screen active">
      <div>
        <div class="label">Options</div>
        <div class="card">
          <div class="opt">
            <div><div class="lbl">Texturer le modèle</div><div class="desc">Couleurs depuis la photo</div></div>
            <label class="switch"><input type="checkbox" id="tex"><span class="slider"></span></label>
          </div>
          <div class="opt">
            <div><div class="lbl">A-pose</div><div class="desc">Bras écartés, rigging facile</div></div>
            <label class="switch"><input type="checkbox" id="apose" checked><span class="slider"></span></label>
          </div>
        </div>
      </div>

      <div>
        <div class="label">Votre photo</div>
        <div id="drop" class="card" role="button" tabindex="0">
          <div class="drop-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
            </svg>
          </div>
          <h2>Ajouter une photo</h2>
          <p>Personne de plein pied · JPG, PNG, WEBP</p>
          <button class="pill" type="button" id="browse">Choisir une photo</button>
        </div>
        <input type="file" id="file" accept="image/*" />
      </div>

      <div class="hint">La génération démarre automatiquement après l'ajout de la photo (1 à 2 min).</div>
    </section>

    <!-- ── ÉTAPE 2 : progression ── -->
    <section id="s-progress" class="screen">
      <div class="card prog-card">
        <img id="pthumb" alt="" />
        <div class="spinner"></div>
        <div class="bar"><i id="pfill"></i></div>
        <div id="ptext">Envoi de la photo…</div>
      </div>
    </section>

    <!-- ── ÉTAPE 3 : résultat ── -->
    <section id="s-result" class="screen">
      <div class="card viewer-card">
        <model-viewer id="mv" camera-controls auto-rotate touch-action="pan-y"
          shadow-intensity="1" exposure="1.05" interaction-prompt="none"
          ar ar-modes="webxr scene-viewer quick-look"></model-viewer>
      </div>
      <button class="btn ghost" id="again" type="button">Nouvelle photo</button>
    </section>
  </main>

  <footer>Propulsé par Meshy AI</footer>

  <script>
    const $=s=>document.querySelector(s);
    const file=$('#file'), drop=$('#drop'), browse=$('#browse'),
          tex=$('#tex'), apose=$('#apose'),
          banner=$('#banner'), mv=$('#mv'), pill=$('#status-pill');
    const screens={upload:$('#s-upload'),progress:$('#s-progress'),result:$('#s-result')};
    let chosen=null, timer=null;

    const show=n=>{for(const k in screens)screens[k].classList.toggle('active',k===n);
      window.scrollTo({top:0,behavior:'smooth'});};
    const err=m=>{banner.textContent=m;banner.className='err show';};
    const clearErr=()=>{banner.className='';};
    const setProg=(p,t)=>{$('#pfill').style.width=Math.max(5,p)+'%';if(t)$('#ptext').textContent=t;};

    // état du service
    fetch('/model_status').then(r=>r.json()).then(d=>{
      if(d.ready){pill.className='ok';pill.textContent='Prêt';}
      else{pill.className='off';pill.textContent='Indisponible';err(d.error||'Service indisponible.');}
    }).catch(()=>{pill.className='off';pill.textContent='Hors ligne';});

    // Choix d'une image -> génération automatique
    function pickFile(f){
      if(!f) return;
      if(!f.type.startsWith('image/')){err('Veuillez choisir une image.');return;}
      chosen=f; clearErr();
      $('#pthumb').src=URL.createObjectURL(f);
      generate();
    }
    browse.addEventListener('click',e=>{e.stopPropagation();file.click();});
    drop.addEventListener('click',()=>file.click());
    drop.addEventListener('keydown',e=>{if(e.key==='Enter')file.click();});
    file.addEventListener('change',e=>pickFile(e.target.files[0]));
    drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag');});
    drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
    drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');pickFile(e.dataTransfer.files[0]);});

    async function generate(){
      if(!chosen) return;
      clearErr(); show('progress'); setProg(5,'Envoi de la photo…');
      const fd=new FormData();
      fd.append('image',chosen);
      fd.append('texture',tex.checked?'1':'0');
      fd.append('apose',apose.checked?'1':'0');
      try{
        const r=await fetch('/upload',{method:'POST',body:fd});
        const d=await r.json();
        if(!r.ok) throw new Error(d.error||'Erreur');
        track(d.job_id);
      }catch(e){show('upload');err(e.message);}
    }

    function track(id){
      timer=setInterval(async()=>{
        try{
          const r=await fetch('/status/'+id);
          const d=await r.json();
          if(!r.ok) throw new Error(d.error||'Erreur');
          const m=(d.stage||'').match(/(\d+)%/);
          const p=m?parseInt(m[1]):(d.status==='processing'?40:10);
          setProg(p, d.status==='processing'?`Génération du modèle… ${p}%`:'En file d\'attente…');
          if(d.status==='done'){clearInterval(timer);openResult(d);}
          if(d.status==='error'){clearInterval(timer);show('upload');err(d.error||'Échec');}
        }catch(e){clearInterval(timer);show('upload');err(e.message);}
      },3000);
    }

    function openResult(d){
      const url=(d.tex_files&&d.tex_files[0])||(d.ply_files&&d.ply_files[0]);
      mv.src=url; show('result');
    }

    $('#again').addEventListener('click',()=>{
      chosen=null; file.value=''; mv.src=''; clearErr(); show('upload');
    });
  </script>
</body>
</html>
