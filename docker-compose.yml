# MyTwin Avatar POC — orchestration des 2 modèles GPU
#
# Sur l'instance Scaleway (build une seule fois, sur place) :
#   docker compose up -d --build   # build les images puis démarre
#
# Builds suivants (sans recompiler) :
#   docker compose up -d
#
# Option registry (pour éviter de rebuild sur une NOUVELLE instance) : voir README.

services:
  geneman:
    build: ./geneman
    image: mytwin-geneman:local
    container_name: geneman
    env_file: .env
    ports:
      - "8001:8000"          # API GeneMAN -> http://<IP_INSTANCE>:8001
    volumes:
      - geneman_weights:/weights
      - ./outputs/geneman:/app/GeneMAN/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "16gb"
    restart: unless-stopped

  unitex:
    build: ./unitex
    image: mytwin-unitex:local
    container_name: unitex
    env_file: .env
    ports:
      - "8002:8000"          # API UniTEX -> http://<IP_INSTANCE>:8002
    volumes:
      - unitex_weights:/weights
      - ./outputs/unitex:/app/UniTEX/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "16gb"
    restart: unless-stopped

volumes:
  geneman_weights:
  unitex_weights:
